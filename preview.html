<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karty odkazů</title><style>*{box-sizing:border-box}body{font-family:"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#242424}.top{height:48px;background:#0078d4;color:#fff;padding:14px 24px;font-weight:600}.page{max-width:1760px;margin:24px auto;padding:28px;background:#fff}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:16px}.card{min-height:250px;display:flex;flex-direction:column;text-decoration:none;color:#242424;border:1px solid #ddd;border-radius:4px;overflow:hidden;transition:.12s}.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px #0002}.image{height:112px;display:flex;align-items:center;justify-content:center}.image img{width:64px;height:64px}.content{padding:16px}.content h2{font-size:17px;margin:0 0 8px}.content p{font-size:14px;line-height:1.45;margin:0;opacity:.78}@media(max-width:1439px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:899px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:559px){.grid{grid-template-columns:1fr}.page{margin:0}}</style></head><body><div class="top">SharePoint</div><main class="page"><h1>Technické informace a podpora</h1><div class="grid" id="grid"></div></main><script>const colors=['#ffffff','#e8f3fb','#f3edf8','#e7f5ea','#fff4ce','#fde7e9','#e6f2f3','#f3f2f1'];const titles=['Katalog zařízení','Dokumentace','Provozní postupy','Bezpečnost','Kontakty','Fotogalerie','Školení','Časté dotazy'];document.querySelector('#grid').innerHTML=titles.map((t,i)=>`<a class="card" href="#" style="background:${colors[i]}"><div class="image"><img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='24' fill='%230078d4'/%3E%3Cpath d='M20 32h24M32 20v24' stroke='white' stroke-width='5'/%3E%3C/svg%3E"></div><div class="content"><h2>${t}</h2><p>Ukázkový popis obsahu a cílové stránky této karty.</p></div></a>`).join('')</script></body></html>
